[project]
name = "subpattern"
version = "0.1.0"
description = "Discover subdomain naming conventions with an LLM, expand them into candidate wordlists in code."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
subpattern = "subpattern.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["subpattern*"]
