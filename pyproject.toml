[project]
name = "subseer"
version = "0.1.0"
description = "Generate new subdomains from the ones you already know, offline or with an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raymond Van Wart" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]
keywords = ["subdomain", "subdomains", "recon", "bug-bounty", "pentest", "osint", "llm", "permutation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Raymond-JV/subseer"
Repository = "https://github.com/Raymond-JV/subseer"
Issues = "https://github.com/Raymond-JV/subseer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
subseer = "subseer.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["subseer*"]

[tool.setuptools.package-data]
subseer = ["data/*.txt", "data/*.md", "prompts/*.txt"]
