[project]
name = "subseer"
version = "0.1.0"
description = "Generate new subdomains from the ones you already know, offline or with an LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
subseer = "subseer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["subseer*"]

[tool.setuptools.package-data]
subseer = ["data/*.txt", "data/*.md", "prompts/*.txt"]
